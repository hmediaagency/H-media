<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><title>H Media – الحضور والانصراف</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--bg:#f6f7f4;--card:#fff;--tx:#111;--mut:#667;--g:#a4cc3c;--gd:#6f9410;--bd:#e3e6dc;--rd:#c0392b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d0d0d;--card:#1a1a1a;--tx:#f1f1f1;--mut:#9a9a9a;--bd:#2c2c2c;--gd:#a4cc3c;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0d0d0d;--card:#1a1a1a;--tx:#f1f1f1;--mut:#9a9a9a;--bd:#2c2c2c;--gd:#a4cc3c;color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif;line-height:1.6}
.w{max-width:760px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;margin-bottom:14px}
h1{font-size:20px;margin:0}h2{font-size:17px;margin:0 0 10px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;gap:8px}
.brand{display:flex;align-items:center;gap:8px;font-weight:800}.logo{width:34px;height:34px;border-radius:8px;background:#111;color:var(--g);display:grid;place-items:center;font-weight:900}
input,select{width:100%;padding:11px;margin:5px 0 10px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font:inherit}
button{font:inherit;border:0;border-radius:10px;padding:11px 16px;background:var(--g);color:#111;font-weight:700;cursor:pointer}
button.s{background:var(--bd);color:var(--tx)}button.d{background:var(--rd);color:#fff}button.sm{padding:5px 10px;font-size:13px}button:disabled{opacity:.4}
.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1}
.tabs{display:flex;gap:6px;margin-bottom:14px;overflow-x:auto}.tabs button{background:var(--card);color:var(--tx);border:1px solid var(--bd);white-space:nowrap}.tabs button.on{background:var(--g);color:#111}
.clock{text-align:center;font-size:36px;font-weight:800;margin:4px 0}.mut{color:var(--mut);font-size:14px}
.sc{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:8px;border-bottom:1px solid var(--bd);text-align:right;white-space:nowrap}
.err{color:var(--rd);min-height:20px}.ok{color:var(--gd)}label.c{display:flex;gap:8px;align-items:center;font-size:14px;margin:4px 0}label.c input{width:auto;margin:0}
.u{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--bd)}
.tag{font-size:12px;background:var(--g);color:#111;border-radius:6px;padding:1px 7px;margin-inline-start:6px}
</style></head><body><div class="w" id="app"><div class="card mut">جاري التحميل…</div></div>
<script>
window.addEventListener('error',function(e){var d=document.getElementById('app')||document.body;d.innerHTML+='<div style="padding:12px;margin:12px;border:2px solid #c0392b;border-radius:10px;font:14px monospace;direction:ltr;word-break:break-all">ERROR: '+(e.message||'')+' | '+(e.filename||'')+':'+(e.lineno||'')+'</div>'});
window.addEventListener('unhandledrejection',function(e){var d=document.getElementById('app')||document.body;d.innerHTML+='<div style="padding:12px;margin:12px;border:2px solid #c0392b;border-radius:10px;font:14px monospace;direction:ltr;word-break:break-all">PROMISE ERROR: '+(e.reason&&e.reason.message||e.reason)+'</div>'});
</script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
// ===== الصقي هنا إعدادات Firebase بتاعتك =====
const FB={apiKey:"AIzaSyChSAylzDENjN5DCBevcizISonI6ng-NhA",authDomain:"hmedia-attendance.firebaseapp.com",projectId:"hmedia-attendance",storageBucket:"hmedia-attendance.firebasestorage.app",messagingSenderId:"656001139972",appId:"1:656001139972:web:543c24f6fa06de8b267c51"};
// ==============================================
let db=null,me=null,users={},att={},isOwner=false,tab='today',msg='',editing=null,filt={d:'',u:''},rcShow=null,forgot=false;
const $=s=>document.querySelector(s),app=$('#app');
const PERMS={users:'إدارة الموظفين',reports:'عرض تقارير الجميع',admins:'إضافة أدمن وتعديل الصلاحيات'};
const pad=n=>String(n).padStart(2,'0');
const WS=9*60,WE=17*60,mn=t=>{const d=new Date(t);return d.getHours()*60+d.getMinutes()};
const fm=m=>m>=60?Math.floor(m/60)+'س '+(m%60)+'د':m+'د';
const hrs=a=>a.in&&a.out?fm(Math.max(0,Math.round((a.out-a.in-bm(a))/60000))):'—';
const bm=a=>(a.brk||[]).reduce((t,b)=>t+((b.e||Date.now())-b.s),0);
const nt=a=>{let n=[];if(a.in&&mn(a.in)>WS)n.push('<span style="color:var(--rd)">تأخير '+fm(mn(a.in)-WS)+'</span>');if(a.out&&mn(a.out)<WE)n.push('<span style="color:var(--rd)">انصراف مبكر '+fm(WE-mn(a.out))+'</span>');if(a.in&&a.out&&!n.length)n.push('<span class="ok">التزام كامل</span>');let b=bm(a)?'استراحة '+fm(Math.round(bm(a)/60000)):'';return n.concat(b?[b]:[]).join(' · ')||'—'};
const dk=(d=new Date())=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const tm=ts=>ts?new Date(ts).toLocaleTimeString('ar-EG',{hour:'2-digit',minute:'2-digit'}):'—';
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function hash(p,s){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s+':'+p));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
const salt=()=>[...crypto.getRandomValues(new Uint8Array(8))].map(x=>x.toString(16)).join('');
const can=p=>me&&(users[me]?.root||users[me]?.perms?.[p]);
const isAdm=()=>me&&(users[me]?.root||users[me]?.role==='admin');
function sess(v){try{v===undefined?0:(v?sessionStorage.setItem('hm',v):sessionStorage.removeItem('hm'));return sessionStorage.getItem('hm')}catch(e){return null}}
async function init(){
 if(!FB.apiKey){app.innerHTML='<div class="card"><h2>الإعدادات ناقصة</h2><p class="mut">افتحي الملف وحطي بيانات Firebase مكان FB في أول السكربت.</p></div>';return}
 try{firebase.initializeApp(FB);db=firebase.firestore()}catch(e){app.innerHTML='<div class="card"><h2>تعذّر تشغيل Firebase</h2><p class="mut">افتحي الصفحة من رابط GitHub في Chrome (مش من داخل Claude ولا من واتساب)، وتأكدي من الإنترنت وإن مفيش إضافة بتحجب المواقع.</p><p style="direction:ltr;font:13px monospace;word-break:break-all">'+(e&&e.message||e)+'</p></div>';return}
 isOwner=true;
 let t=setTimeout(()=>{if(!ready)render()},10000),ready=false;
 db.collection('users').onSnapshot(s=>{users={};s.docs.forEach(d=>users[d.id]=d.data());ready=true;clearTimeout(t);me=sess();if(me&&!users[me]||me&&users[me].active===false){sess(null);me=null}render()},()=>{app.innerHTML=hdr()+'<div class="card err">تعذّر الاتصال بقاعدة البيانات. راجعي إعدادات Firebase وقواعد Firestore.</div>'});
 db.collection('att').onSnapshot(s=>{att={};s.docs.forEach(d=>att[d.id]=d.data());render()},()=>{});
 setInterval(()=>{const c=$('#clk');if(c)c.textContent=new Date().toLocaleTimeString('ar-EG')},1000);
}
function hdr(){return`<div class="top"><div class="brand"><div class="logo">H</div>H Media</div><div>${me?`<span class="mut">${esc(users[me].name)}</span> <button class="s sm" onclick="logout()">خروج</button>`:''}</div></div>`}
function render(){const sv={};['n','u','c'].forEach(i=>{const e=document.getElementById(i);if(e)sv[i]=e.value});render0();if(msg)for(const i in sv){const e=document.getElementById(i);if(e)e.value=sv[i]}}
function render0(){
 if(editing&&document.activeElement&&['INPUT','SELECT'].includes(document.activeElement.tagName)&&0)return;
 if(!Object.keys(users).length){app.innerHTML=hdr()+setup();return}
 if(!me){app.innerHTML=hdr()+loginV();return}
 if(rcShow){app.innerHTML=hdr()+rcCard();return}
 let h=hdr(),tabs=[['today','حضوري']];
 if(can('reports'))tabs.push(['rep','التقارير']);
 if(can('users')||can('admins'))tabs.push(['usr','الموظفين']);
 h+=`<div class="tabs">${tabs.map(t=>`<button class="${tab===t[0]?'on':''}" onclick="tab='${t[0]}';msg='';render()">${t[1]}</button>`).join('')}</div>`;
 if(!tabs.find(t=>t[0]===tab))tab='today';
 h+=tab==='today'?today():tab==='rep'?rep():usr();
 const keep=[...app.querySelectorAll('input,select')].map(e=>e.value);
 app.innerHTML=h;
}
function setup(){return isOwner?`<div class="card"><h2>إعداد النظام (أول مرة)</h2><p class="mut">أنشئي حساب الأدمن الرئيسي.</p>
<input id="n" placeholder="الاسم"><input id="u" placeholder="اسم المستخدم (إنجليزي)" autocapitalize="off"><input id="p" type="password" placeholder="كلمة المرور (6 أحرف أو أكثر)">
<label class="c"><input type="checkbox" onchange="pw(this)"> إظهار كلمة المرور</label><div class="err">${msg}</div><button onclick="doSetup()">إنشاء الأدمن</button></div>`:`<div class="card">النظام لسه مش متجهز. صاحب الصفحة لازم يفتحها أول مرة ويعمل حساب الأدمن.</div>`}
async function doSetup(){const n=$('#n').value.trim(),u=$('#u').value.trim().toLowerCase(),p=$('#p').value;
 if(!n||!/^[a-z0-9_.]+$/.test(u)||p.length<6){msg='املئي البيانات (اسم مستخدم بحروف إنجليزية، وكلمة مرور 6+)';render();return}
 const s=salt();const hh=await hash(p,s),rc=[...crypto.getRandomValues(new Uint8Array(12))].map(x=>'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'[x%32]).join(''),rs=salt(),rh=await hash(rc,rs);
 rcShow=rc.match(/.{4}/g).join('-');sess(u);me=u;tab='today';msg='';await db.collection('users').doc(u).set({name:n,salt:s,hash:hh,rsalt:rs,rhash:rh,role:'admin',root:true,active:true,perms:{users:true,reports:true,admins:true}})}
function pw(c){$('#p').type=c.checked?'text':'password'}
function rcCard(){return`<div class="card"><h2>كود استرجاع كلمة المرور</h2><p>احتفظي بالكود ده في مكان آمن (صوّريه أو اكتبيه). هتحتاجيه لو نسيتي كلمة مرور الأدمن، ومش هيظهر تاني.</p><div id="rc" style="direction:ltr;font:700 22px monospace;text-align:center;padding:14px;background:var(--bg);border-radius:10px;user-select:all">${rcShow}</div><button style="width:100%;margin-top:12px" onclick="rcShow=null;render()">حفظت الكود، متابعة</button></div>`}
function forgotV(){return`<div class="card"><h2>نسيت كلمة المرور</h2><p class="mut">للأدمن الرئيسي: اكتبي اسم المستخدم وكود الاسترجاع وكلمة مرور جديدة. الموظف يطلب من الأدمن يغيّر له كلمة المرور من تبويب الموظفين.</p><input id="u" placeholder="اسم المستخدم" autocapitalize="off"><input id="c" placeholder="كود الاسترجاع" autocapitalize="characters" style="direction:ltr"><input id="p" type="password" placeholder="كلمة المرور الجديدة (6+)"><label class="c"><input type="checkbox" onchange="pw(this)"> إظهار كلمة المرور</label><div class="err">${msg}</div><div class="row"><button onclick="doForgot()">تغيير كلمة المرور</button><button class="s" onclick="forgot=false;msg='';render()">رجوع</button></div></div>`}
async function doForgot(){const u=$('#u').value.trim().toLowerCase(),c=$('#c').value.replace(/[\s-]/g,'').toUpperCase(),p=$('#p').value,x=users[u];
 if(!x||!x.rhash||p.length<6||await hash(c,x.rsalt)!==x.rhash){msg='البيانات غير صحيحة، أو الحساب ده مالوش كود استرجاع (اطلبي من الأدمن)';render();return}
 const sl=salt();await db.collection('users').doc(u).update({salt:sl,hash:await hash(p,sl)});forgot=false;msg='';sess(u);me=u;tab='today';render()}
function loginV(){if(forgot)return forgotV();return`<div class="card"><h2>تسجيل الدخول</h2><input id="u" placeholder="اسم المستخدم" autocapitalize="off"><input id="p" type="password" placeholder="كلمة المرور" onkeydown="if(event.key==='Enter')login()"><label class="c"><input type="checkbox" onchange="pw(this)"> إظهار كلمة المرور</label><div class="err">${msg}</div><button onclick="login()" style="width:100%">دخول</button><p style="text-align:center;margin:12px 0 0"><a href="#" style="color:var(--gd)" onclick="forgot=true;msg='';render();return false">نسيت كلمة المرور؟</a></p></div>`}
async function login(){const u=$('#u').value.trim().toLowerCase(),p=$('#p').value,x=users[u];
 if(!x||x.active===false||await hash(p,x.salt)!==x.hash){msg='اسم المستخدم أو كلمة المرور غلط';render();return}
 msg='';sess(u);me=u;tab='today';render()}
function logout(){sess(null);me=null;render()}
function today(){const k=me+'_'+dk(),r=att[k]||{},br=r.brk||[],onB=br.length&&!br[br.length-1].e;
 const mine=Object.values(att).filter(a=>a.u===me).sort((a,b)=>b.date.localeCompare(a.date)).slice(0,14);
 return`<div class="card"><div class="mut" style="text-align:center">${new Date().toLocaleDateString('ar-EG',{weekday:'long',day:'numeric',month:'long'})}</div><div class="clock" id="clk">${new Date().toLocaleTimeString('ar-EG')}</div>
<div class="row"><button onclick="punch('in')" ${r.in?'disabled':''}>تسجيل حضور</button><button class="d" onclick="punch('out')" ${!r.in||r.out?'disabled':''}>تسجيل انصراف</button></div>
<div class="row" style="margin-top:8px"><button class="s" onclick="punch('bs')" ${!r.in||r.out||onB?'disabled':''}>بدء استراحة</button><button class="s" onclick="punch('be')" ${onB?'':'disabled'}>إنهاء الاستراحة</button></div>
<p class="mut" style="text-align:center">حضور: ${tm(r.in)} — انصراف: ${tm(r.out)}<br>مواعيد العمل: 9:00 ص – 5:00 م${r.in?'<br>'+nt(r):''}${onB?'<br><b>⏸ في استراحة</b>':''}</p></div>
<div class="card"><h2>آخر أيامي</h2><div class="sc"><table><tr><th>التاريخ</th><th>حضور</th><th>انصراف</th><th>الساعات</th><th>ملاحظات</th></tr>${mine.map(a=>`<tr><td>${a.date}</td><td>${tm(a.in)}</td><td>${tm(a.out)}</td><td>${hrs(a)}</td><td>${nt(a)}</td></tr>`).join('')||'<tr><td colspan=5 class="mut">لا يوجد</td></tr>'}</table></div></div>`}
async function punch(t){const d=dk(),k=me+'_'+d,r=att[k]||{u:me,name:users[me].name,date:d},now=Date.now();r.brk=r.brk||[];const l=r.brk[r.brk.length-1],ob=l&&!l.e;
 if(t==='in'){if(r.in)return;r.in=now}else if(t==='out'){if(!r.in||r.out)return;if(ob)l.e=now;r.out=now}
 else if(t==='bs'){if(!r.in||r.out||ob)return;r.brk.push({s:now})}else if(t==='be'){if(!ob)return;l.e=now}
 await db.collection('att').doc(k).set(r)}
function rep(){const l=Object.values(att).filter(a=>(!filt.d||a.date===filt.d)&&(!filt.u||a.u===filt.u)).sort((a,b)=>b.date.localeCompare(a.date)||a.name.localeCompare(b.name));
 return`<div class="card"><h2>تقرير الحضور</h2><div class="row"><div><span class="mut">التاريخ</span><input type="date" value="${filt.d}" onchange="filt.d=this.value;render()"></div><div><span class="mut">الموظف</span><select onchange="filt.u=this.value;render()"><option value="">الكل</option>${Object.entries(users).map(([i,u])=>`<option value="${i}" ${filt.u===i?'selected':''}>${esc(u.name)}</option>`).join('')}</select></div></div>
<div class="sc"><table><tr><th>الموظف</th><th>التاريخ</th><th>حضور</th><th>انصراف</th><th>الساعات</th><th>ملاحظات</th></tr>${l.map(a=>`<tr><td>${esc(a.name)}</td><td>${a.date}</td><td>${tm(a.in)}</td><td>${tm(a.out)}</td><td>${hrs(a)}</td><td>${nt(a)}</td></tr>`).join('')||'<tr><td colspan=6 class="mut">لا يوجد بيانات</td></tr>'}</table></div></div>`}
function usr(){const ca=can('admins'),e=editing&&users[editing];
 return`<div class="card"><h2>${e?'تعديل: '+esc(e.name):'إضافة موظف'}</h2>
${e?'':`<input id="n" placeholder="الاسم"><input id="u" placeholder="اسم المستخدم (إنجليزي)" autocapitalize="off">`}
<input id="p" type="password" placeholder="${e?'كلمة مرور جديدة (اتركيها فاضية لو مش هتغير)':'كلمة المرور (6+)'}">
${ca&&!(e&&e.root)?`<label class="c"><input type="checkbox" id="adm" ${e&&e.role==='admin'?'checked':''}> أدمن</label>${Object.entries(PERMS).map(([k,v])=>`<label class="c" style="margin-inline-start:22px"><input type="checkbox" class="pm" data-k="${k}" ${e&&e.perms?.[k]?'checked':''}> ${v}</label>`).join('')}`:''}
<div class="err">${msg}</div><div class="row"><button onclick="saveU()">${e?'حفظ':'إضافة'}</button>${e?'<button class="s" onclick="editing=null;msg=\'\';render()">إلغاء</button>':''}</div></div>
<div class="card"><h2>الموظفين (${Object.keys(users).length})</h2>${Object.entries(users).map(([i,u])=>`<div class="u"><div>${esc(u.name)} <span class="mut">@${i}</span>${u.root?'<span class="tag">رئيسي</span>':u.role==='admin'?'<span class="tag">أدمن</span>':''}${u.active===false?' <span class="mut">(موقوف)</span>':''}</div>
<div class="row" style="flex:none">${!u.root&&(u.role!=='admin'||ca)?`<button class="s sm" onclick="editing='${i}';msg='';render()">تعديل</button><button class="s sm" onclick="tog('${i}')">${u.active===false?'تفعيل':'إيقاف'}</button><button class="d sm" onclick="del('${i}')">حذف</button>`:''}</div></div>`).join('')}</div>`}
async function saveU(){const p=$('#p').value,ca=can('admins'),ad=ca&&$('#adm')?.checked,pm={};
 document.querySelectorAll('.pm').forEach(c=>pm[c.dataset.k]=c.checked&&ad);
 if(editing){const o=users[editing],d={};if(p){if(p.length<6){msg='كلمة المرور 6 أحرف على الأقل';render();return}d.salt=salt();d.hash=await hash(p,d.salt)}
  if(ca&&!o.root){d.role=ad?'admin':'employee';d.perms=pm}
  await db.collection('users').doc(editing).update(d);editing=null;msg='';render();return}
 const n=$('#n').value.trim(),u=$('#u').value.trim().toLowerCase();
 if(!n||!/^[a-z0-9_.]+$/.test(u)||p.length<6){msg='املئي البيانات (اسم مستخدم إنجليزي، وكلمة مرور 6+)';render();return}
 if(users[u]){msg='اسم المستخدم موجود بالفعل';render();return}
 const s=salt();await db.collection('users').doc(u).set({name:n,salt:s,hash:await hash(p,s),role:ad?'admin':'employee',active:true,perms:pm});msg=''}
async function tog(i){await db.collection('users').doc(i).update({active:users[i].active===false})}
async function del(i){if(confirm('حذف '+users[i].name+'؟ (سجل حضوره هيفضل محفوظ)'))await db.collection('users').doc(i).delete()}
init();
</script></body></html>
